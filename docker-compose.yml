# Entorno local reproducible (research.md R16). Las credenciales se leen de .env.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - taskflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskflow_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d taskflow_test']
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: ['test']

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "npm run db:migrate -w apps/api && npm run board:init -w apps/api"
    networks:
      - taskflow
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: ${API_PORT:-3000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Solo el contenedor web (IP fija) puede indicar la IP real del cliente (plan D11).
      TRUST_PROXY: 172.28.0.10
      BOARD_CREATION_ENABLED: ${BOARD_CREATION_ENABLED:-true}
      BOARD_CREATION_PER_HOUR: ${BOARD_CREATION_PER_HOUR:-10}
    networks:
      - taskflow
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:${API_PORT:-3000}
      VITE_HOST: 0.0.0.0
    networks:
      taskflow:
        ipv4_address: 172.28.0.10
    ports:
      - '5173:5173'
    depends_on:
      - api

networks:
  taskflow:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db-data:
